  <!-- Pilar derecho -->
  <rect x="22" y="8" width="5" height="16" rx="1.5" fill="#1D9E75"/>
  <!-- Diagonal izquierda -->
  <rect x="9" y="7" width="5" height="9" rx="1.5" fill="#5DCAA5" transform="rotate(32 11.5 11.5)"/>
  <!-- Diagonal derecha -->
